<body>
    <div id="root"></div>

        const Calendar = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>;

        const Flame = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>;
        const Camera = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>;
        const ChevronRight = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>;
        const Menu = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>;
        const X = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>;
        const Phone = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>;
        const Instagram = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/></svg>;
        const Facebook = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>;
        const Twitter = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 4s-.7 2.1-2 3.4c1.6 10-9.4 17.3-18 11.6 2.2.1 4.4-.6 6-2C3 15.5.5 9.6 3 5c2.2 2.6 5.6 4.1 9 4-.9-4.2 4-6.6 7-3.8 1.1 0 3-1.2 3-1.2z"/></svg>;
        const MessageCircle = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>;
        const Download = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>;
        const User = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;
        const Mail = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>;

        function TravelLanding() {
          const [isMenuOpen, setIsMenuOpen] = useState(false);
          const [scrolled, setScrolled] = useState(false);
          const [showBookingForm, setShowBookingForm] = useState(false);
          const [formData, setFormData] = useState({
            name: '',
            email: '',
            phone: '',
            batch: 'batch1',
            travelers: '1',
            message: ''
          });

          useEffect(() => {
            const handleScroll = () => {
              setScrolled(window.scrollY > 50);
            };
            window.addEventListener('scroll', handleScroll);
            return () => window.removeEventListener('scroll', handleScroll);
          }, []);

          const handleInputChange = (e) => {
            setFormData({
              ...formData,
              [e.target.name]: e.target.value
            });
          };

          const handleSubmit = (e) => {
            e.preventDefault();
            const message = `Hello! I want to book the Manali-Kasol trip.
            
Name: ${formData.name}
Email: ${formData.email}
Phone: ${formData.phone}
Batch: ${formData.batch === 'batch1' ? '11-16 Dec' : '02-07 Jan'}
Number of Travelers: ${formData.travelers}
Message: ${formData.message}`;

            const whatsappUrl = `https://wa.me/919351168521?text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank');
          };

          const whatsappContact = () => {
            window.open('https://wa.me/919351168521', '_blank');
          };

          const downloadBrochure = () => {
            const brochureContent = `TRAVEL ON HEAVEN
Manali • Kasol • Sissu Trip
5 Nights / 6 Days

PRICE: ₹6,500/- per person

Contact: Vedant 93682 23654, Nitesh 93511 68521, Pratyaksha 70112 34228`;

            const blob = new Blob([brochureContent], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Manali-Kasol-Trip.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
          };

          return (
            <div className="min-h-screen bg-gradient-to-b from-slate-900 via-slate-800 to-slate-900 text-white">
              {/* WhatsApp Button */}
              <button
                onClick={whatsappContact}
                className="fixed bottom-6 right-6 z-50 bg-green-500 hover:bg-green-600 text-white rounded-full p-4 shadow-2xl transition-all transform hover:scale-110"
              >
                <MessageCircle />
              </button>

              {/* Navigation */}
              <nav className={`fixed w-full z-50 transition-all duration-300 ${scrolled ? 'bg-slate-900/95 backdrop-blur-lg shadow-lg' : 'bg-transparent'}`}>
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                  <div className="flex justify-between items-center h-20">
                    <div className="flex items-center space-x-2">
                      <Mountain />
                      <span className="text-2xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">
                        Travel on Heaven
                      </span>
                    </div>
                    
                    <div className="hidden md:flex items-center space-x-8">

                      <a href="#itinerary" className="hover:text-cyan-400 transition-colors">Itinerary</a>
                      <a href="#details" className="hover:text-cyan-400 transition-colors">Details</a>
                      <a href="#contact" className="hover:text-cyan-400 transition-colors">Contact</a>
                      
                      <div className="flex items-center space-x-3">
                        <a href="https://www.instagram.com/nitesh_mahala_07?igsh=MWtkNWRoZzI0NmEyYw==" target="_blank" className="hover:text-cyan-400">
                          <Instagram />
                        </a>
                        <a href="https://facebook.com" target="_blank" className="hover:text-cyan-400">
                          <Facebook />
                        </a>
                      </div>
                    </div>

                    <button className="md:hidden" onClick={() => setIsMenuOpen(!isMenuOpen)}>
                      {isMenuOpen ? <X /> : <Menu />}
                    </button>
                  </div>
                </div>

                {isMenuOpen && (
                  <div className="md:hidden bg-slate-800 border-t border-slate-700 px-4 py-4 space-y-3">
                    <a href="#home" className="block hover:text-cyan-400">Home</a>
                    <a href="#itinerary" className="block hover:text-cyan-400">Itinerary</a>
                    <a href="#details" className="block hover:text-cyan-400">Details</a>
                    <a href="#contact" className="block hover:text-cyan-400">Contact</a>
                  </div>
                )}
              </nav>

              {/* Hero */}
              <section id="home" className="relative pt-32 pb-20 px-4">
                <div className="max-w-7xl mx-auto text-center">
                  <h1 className="text-5xl md:text-7xl font-bold mb-6">
                    <span className="bg-gradient-to-r from-cyan-400 via-blue-500 to-purple-600 bg-clip-text text-transparent">
                      Manali • Kasol • Sissu
                    </span>
                  </h1>
                  <p className="text-xl md:text-2xl text-slate-300 mb-8">5 Nights • 6 Days of Pure Adventure</p>
                  
                  <div className="flex flex-wrap justify-center gap-4 mb-12">
                    <div className="bg-slate-800/50 px-6 py-3 rounded-full border border-cyan-400/30">
                      <Calendar /><span className="ml-2"><strong>Batch 1:</strong> 11-16 Dec</span>
                    </div>
                    <div className="bg-slate-800/50 px-6 py-3 rounded-full border border-cyan-400/30">
                      <Calendar /><span className="ml-2"><strong>Batch 2:</strong> 02-07 Jan</span>
                    </div>
                  </div>

                  <div className="flex flex-col sm:flex-row justify-center gap-4 mb-8">
                    <button 
                      onClick={() => setShowBookingForm(true)}
                      className="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-600 hover:to-blue-700 px-8 py-4 rounded-full font-bold text-lg transition-all transform hover:scale-105"
                    >
                      Book Now at ₹6,500/-
                    </button>
                    <button
                      onClick={downloadBrochure}
                      className="bg-slate-800/50 border-2 border-cyan-400 px-8 py-4 rounded-full font-bold text-lg flex items-center justify-center gap-2"
                    >
                      <Download />Download Brochure
                    </button>
                  </div>

                  <div className="grid grid-cols-2 md:grid-cols-4 gap-4 max-w-4xl mx-auto">
                    <div className="bg-slate-800/30 border border-slate-700 rounded-xl p-6 text-center">
                      <Tent /><p className="mt-3 font-medium">4 Nights Stay</p>
                    </div>
                    <div className="bg-slate-800/30 border border-slate-700 rounded-xl p-6 text-center">
                      <Camera /><p className="mt-3 font-medium">All Sightseeing</p>
                    </div>
                    <div className="bg-slate-800/30 border border-slate-700 rounded-xl p-6 text-center">
                      <Flame /><p className="mt-3 font-medium">Bonfire & Music</p>
                    </div>
                    <div className="bg-slate-800/30 border border-slate-700 rounded-xl p-6 text-center">
                      <Users /><p className="mt-3 font-medium">Trip Leader</p>
                    </div>
                  </div>
                </div>
              </section>

              {/* Itinerary */}
              <section id="itinerary" className="py-20 px-4">
                <div className="max-w-6xl mx-auto">
                  <h2 className="text-4xl md:text-5xl font-bold text-center mb-12">
                    Your <span className="text-cyan-400">Adventure</span> Awaits
                  </h2>
                  
                  <div className="grid md:grid-cols-2 gap-6">
                    {[
                      { day: 1, title: "Delhi to Manali", desc: "Evening departure from Rohini. Overnight journey in deluxe AC traveller." },
                      { day: 2, title: "Manali Local Sightseeing", desc: "Hadimba Temple, Van Vihar, Mall Road & Jogini Waterfall trek." },
                      { day: 3, title: "Rohtang & Sissu", desc: "Atal Tunnel, snow activities, DJ night & bonfire." },
                      { day: 4, title: "Kasol Camping", desc: "Paragliding, river rafting & riverside camping with music." },
                      { day: 5, title: "Old Manali Exploration", desc: "Bike ride through snow-capped mountains & Solang Valley." },
                      { day: 6, title: "Manikaran & Kasol Market", desc: "Hot spring bath, Gurudwara visit & cafe hopping." },
                      { day: 7, title: "Return to Delhi", desc: "Early morning arrival with unforgettable memories." }
                    ].map((item) => (
                      <div key={item.day} className="bg-slate-800/50 border border-slate-700 rounded-2xl p-6">
                        <div className="flex items-start space-x-4">
                          <div className="flex-shrink-0 w-12 h-12 bg-gradient-to-br from-cyan-500 to-blue-600 rounded-full flex items-center justify-center font-bold text-lg">
                            {item.day}
                          </div>
                          <div>
                            <h3 className="text-xl font-bold mb-2">{item.title}</h3>
                            <p className="text-slate-400 text-sm">{item.desc}</p>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </section>

              {/* Pricing */}
              <section id="details" className="py-20 px-4 bg-slate-800/30">
                <div className="max-w-4xl mx-auto">
                  <div className="bg-gradient-to-br from-slate-800 to-slate-900 rounded-3xl p-8 md:p-12 border-2 border-cyan-400/30">
                    <div className="text-center mb-8">
                      <h2 className="text-4xl font-bold mb-2">All-Inclusive Package</h2>
                      <div className="text-6xl font-bold text-cyan-400 mb-4">₹6,500/-</div>
                      <p className="text-slate-400">Per Person</p>
                    </div>

                    <div className="grid md:grid-cols-2 gap-6 mb-8">
                      <div>
                        <h3 className="text-xl font-bold mb-4 text-cyan-400">✓ Inclusions</h3>
                        <ul className="space-y-2 text-slate-300">
                          <li>• 4 Nights Accommodation</li>
                          <li>• 6 Meals (3 Breakfast + 3 Dinner)</li>
                          <li>• Deluxe AC Traveller</li>
                          <li>• All Sightseeing</li>
                          <li>• Bonfire & Music</li>
                          <li>• Trip Leader</li>
                        </ul>
                      </div>

                      <div>
                        <h3 className="text-xl font-bold mb-4 text-orange-400">✗ Exclusions</h3>
                        <ul className="space-y-2 text-slate-300">
                          <li>• 5% GST</li>
                          <li>• Lunch & Highway Meals</li>
                          <li>• Snow Activities</li>
                          <li>• Paragliding & Rafting</li>
                          <li>• Personal Expenses</li>
                        </ul>
                      </div>
                    </div>

                    <div className="text-center">
                      <button 
                        onClick={() => setShowBookingForm(true)}
                        className="bg-gradient-to-r from-cyan-500 to-blue-600 px-12 py-4 rounded-full font-bold text-lg"
                      >
                        Reserve Your Spot Now <ChevronRight className="inline" />
                      </button>
                    </div>
                  </div>
                </div>
              </section>

              {/* Contact */}
              <section id="contact" className="py-20 px-4">
                <div className="max-w-4xl mx-auto text-center">
                  <h2 className="text-4xl md:text-5xl font-bold mb-8">
                    Ready to <span className="text-cyan-400">Explore?</span>
                  </h2>

                  <div className="grid md:grid-cols-3 gap-6 mb-12">
                    <a href="tel:9368223654" className="bg-slate-800/50 border border-slate-700 rounded-xl p-6">
                      <Phone className="mx-auto mb-3" />
                      <p className="font-bold">Vedant</p>
                      <p className="text-slate-400">93682 23654</p>
                    </a>
                    <a href="tel:9351168521" className="bg-slate-800/50 border border-slate-700 rounded-xl p-6">
                      <Phone className="mx-auto mb-3" />
                      <p className="font-bold">Nitesh</p>
                      <p className="text-slate-400">93511 68521</p>
                    </a>
                    <a href="tel:7011234228" className="bg-slate-800/50 border border-slate-700 rounded-xl p-6">
                      <Phone className="mx-auto mb-3" />
                      <p className="font-bold">Pratyaksha</p>
                      <p className="text-slate-400">70112 34228</p>
                    </a>
                  </div>
                </div>
              </section>

              {/* Booking Form Modal */}
              {showBookingForm && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70">
                  <div className="bg-slate-800 rounded-3xl p-8 max-w-md w-full max-h-[90vh] overflow-y-auto border-2 border-cyan-400/30">
                    <div className="flex justify-between items-center mb-6">
                      <h3 className="text-2xl font-bold text-cyan-400">Book Your Trip</h3>
                      <button onClick={() => setShowBookingForm(false)} className="text-slate-400">
                        <X />
                      </button>
                    </div>

                    <form onSubmit={handleSubmit} className="space-y-4">
                      <div>
                        <label className="block text-sm font-medium mb-2">Full Name *</label>
                        <input
                          type="text"
                          name="name"
                          required
                          value={formData.name}
                          onChange={handleInputChange}
                          className="w-full bg-slate-700/50 border border-slate-600 rounded-lg px-4 py-3 focus:outline-none focus:border-cyan-400"
                          placeholder="Enter your name"
                        />
                      </div>

                      <div>
                        <label className="block text-sm font-medium mb-2">Email *</label>
                        <input
                          type="email"
                          name="email"
                          required
                          value={formData.email}
                          onChange={handleInputChange}
                          className="w-full bg-slate-700/50 border border-slate-600 rounded-lg px-4 py-3 focus:outline-none focus:border-cyan-400"
                          placeholder="your.email@example.com"
                        />
                      </div>

                      <div>
                        <label className="block text-sm font-medium mb-2">Phone Number *</label>
                        <input
                          type="tel"
                          name="phone"
                          required
                          value={formData.phone}
                          onChange={handleInputChange}
                          className="w-full bg-slate-700/50 border border-slate-600 rounded-lg px-4 py-3 focus:outline-none focus:border-cyan-400"
                          placeholder="10-digit mobile number"
                        />
                      </div>

                      <div>
                        <label className="block text-sm font-medium mb-2">Select Batch *</label>
                        <select
                          name="batch"
                          required
                          value={formData.batch}
                          onChange={handleInputChange}
                          className="w-full bg-slate-700/50 border border-slate-600 rounded-lg px-4 py-3 focus:outline-none focus:border-cyan-400"
                        >
                          <option value="batch1">Batch 1: 11-16 December</option>
                          <option value="batch2">Batch 2: 02-07 January</option>
                        </select>
                      </div>

                      <div>
                        <label className="block text-sm font-medium mb-2">Number of Travelers *</label>
                        <select
                          name="travelers"
                          required
                          value={formData.travelers}
                          onChange={handleInputChange}
                          className="w-full bg- slate-700/50 border border-slate-600 rounded-lg px-4 py-3 focus:outline-none focus:border-cyan-400"
>
<option value="1">1 Person</option>
<option value="2">2 People</option>
<option value="3">3 People</option>
<option value="4">4 People</option>
<option value="5">5 People</option>
<option value="6+">6+ People</option>
</select>
</div>
                      <div>
                    <label className="block text-sm font-medium mb-2">Message (Optional)</label>
                    <textarea
                      name="message"
                      value={formData.message}
                      onChange={handleInputChange}
                      rows="3"
                      className="w-full bg-slate-700/50 border border-slate-600 rounded-lg px-4 py-3 focus:outline-none focus:border-cyan-400 resize-none"
                      placeholder="Any special requests?"
                    ></textarea>
                  </div>

                  <button
                    type="submit"
                    className="w-full bg-gradient-to-r from-green-500 to-green-600 hover:from-green-600 hover:to-green-700 text-white font-bold py-4 rounded-lg transition-all flex items-center justify-center gap-2"
                  >
                    <MessageCircle />
                    Send via WhatsApp
